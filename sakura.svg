<svg viewBox="0 0 180 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="p-lg" d="M0 0 C15 -12,16 -30,0 -42 C-16 -30,-15 -12,0 0"/>
    <path id="p-md" d="M0 0 C10 -8,11 -20,0 -30 C-11 -20,-10 -8,0 0"/>
    <path id="p-sm" d="M0 0 C7 -6,8 -14,0 -21 C-8 -14,-7 -6,0 0"/>
    <path id="p-xs" d="M0 0 C4 -4,5 -9,0 -14 C-5 -9,-4 -4,0 0"/>
  </defs>
  <!-- large flower — bleeds off left edge, vertically centered -->
  <g transform="translate(15,130)" fill="#ffc2d1">
    <use href="#p-lg" transform="rotate(0)"/>
    <use href="#p-lg" transform="rotate(72)"/>
    <use href="#p-lg" transform="rotate(144)"/>
    <use href="#p-lg" transform="rotate(216)"/>
    <use href="#p-lg" transform="rotate(288)"/>
    <circle r="11"/>
  </g>
  <!-- medium flower, upper -->
  <g transform="translate(60,88)" fill="#ffc2d1">
    <use href="#p-md" transform="rotate(36)"/>
    <use href="#p-md" transform="rotate(108)"/>
    <use href="#p-md" transform="rotate(180)"/>
    <use href="#p-md" transform="rotate(252)"/>
    <use href="#p-md" transform="rotate(324)"/>
    <circle r="8"/>
  </g>
  <!-- medium flower, lower -->
  <g transform="translate(55,172)" fill="#ffc2d1">
    <use href="#p-md" transform="rotate(18)"/>
    <use href="#p-md" transform="rotate(90)"/>
    <use href="#p-md" transform="rotate(162)"/>
    <use href="#p-md" transform="rotate(234)"/>
    <use href="#p-md" transform="rotate(306)"/>
    <circle r="8"/>
  </g>
  <!-- small flower, right of center -->
  <g transform="translate(78,128)" fill="#ffc2d1">
    <use href="#p-sm" transform="rotate(0)"/>
    <use href="#p-sm" transform="rotate(72)"/>
    <use href="#p-sm" transform="rotate(144)"/>
    <use href="#p-sm" transform="rotate(216)"/>
    <use href="#p-sm" transform="rotate(288)"/>
    <circle r="6"/>
  </g>
  <!-- tiny flower, nestled upper -->
  <g transform="translate(70,104)" fill="#ffc2d1">
    <use href="#p-xs" transform="rotate(18)"/>
    <use href="#p-xs" transform="rotate(90)"/>
    <use href="#p-xs" transform="rotate(162)"/>
    <use href="#p-xs" transform="rotate(234)"/>
    <use href="#p-xs" transform="rotate(306)"/>
    <circle r="4"/>
  </g>
  <!-- tiny flower, nestled lower -->
  <g transform="translate(68,157)" fill="#ffc2d1">
    <use href="#p-xs" transform="rotate(0)"/>
    <use href="#p-xs" transform="rotate(72)"/>
    <use href="#p-xs" transform="rotate(144)"/>
    <use href="#p-xs" transform="rotate(216)"/>
    <use href="#p-xs" transform="rotate(288)"/>
    <circle r="4"/>
  </g>
</svg>
